<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GET - Listar alunos</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 24px 16px; color: #222; }
    nav a { margin-right: 12px; }
    h1 span { background: #1a7f37; color: #fff; padding: 2px 10px; border-radius: 6px; font-size: .8em; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 20px 0; }
    input, button { font-size: 1rem; padding: 6px 10px; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border-bottom: 1px solid #ddd; padding: 6px 8px; text-align: left; }
    .erro { color: #cf222e; }
  </style>
</head>
<body>
  <nav>
    <a href="get.html">GET</a> <a href="post.html">POST</a> <a href="put.html">PUT</a> <a href="delete.html">DELETE</a>
  </nav>

  <h1><span>GET</span> Buscar alunos</h1>
  <p>O método <strong>GET</strong> serve para <strong>ler</strong> dados. Ele não envia corpo (body), só pede uma URL.</p>

  <!-- Exemplo 1: listar todos -->
  <section>
    <h2>1. Listar todos: GET /alunos</h2>
    <button id="btnListar">Carregar alunos</button>
    <p id="statusLista"></p>
    <table>
      <thead>
        <tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Curso</th><th>Idade</th></tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
  </section>

  <!-- Exemplo 2: buscar um pelo id -->
  <section>
    <h2>2. Buscar um: GET /alunos/{id}</h2>
    <input id="inputId" type="number" min="1" value="1">
    <button id="btnBuscar">Buscar</button>
    <p id="resultado"></p>
  </section>

  <script>
    // Endereço da API
    const API_URL = 'https://fiap-ad-aula11-api.vercel.app';

    // ------------------------------------------------------------
    // Exemplo 1: listar todos os alunos
    // ------------------------------------------------------------
    async function listarAlunos() {
      const status = document.getElementById('statusLista');
      const tabela = document.getElementById('tabela');
      status.textContent = 'Carregando...';

      // 1) Faz a requisição. Sem segundo parâmetro, o fetch usa GET.
      const resposta = await fetch(API_URL + '/alunos');

      // 2) Converte o corpo da resposta de JSON para objeto JavaScript.
      //    Aqui vem um ARRAY de alunos.
      const alunos = await resposta.json();

      // 3) Limpa a tabela e cria uma linha para cada aluno
      tabela.innerHTML = '';
      alunos.forEach(function (aluno) {
        const linha = document.createElement('tr');

        // Usamos textContent (e não innerHTML) para mostrar os dados.
        // Assim, se alguém cadastrar um nome com código HTML, ele aparece como texto.
        [aluno.id, aluno.nome, aluno.email, aluno.curso, aluno.idade].forEach(function (valor) {
          const celula = document.createElement('td');
          celula.textContent = valor ?? '-'; // ?? troca null por '-'
          linha.appendChild(celula);
        });

        tabela.appendChild(linha);
      });

      status.textContent = alunos.length + ' aluno(s) encontrado(s).';
    }

    // ------------------------------------------------------------
    // Exemplo 2: buscar um aluno pelo id
    // ------------------------------------------------------------
    async function buscarAluno() {
      const id = document.getElementById('inputId').value;
      const resultado = document.getElementById('resultado');

      const resposta = await fetch(API_URL + '/alunos/' + id);
      const dados = await resposta.json();

      // ATENÇÃO: o fetch NÃO dá erro quando o aluno não existe (status 404).
      // Por isso conferimos resposta.ok (true quando o status é 200 a 299).
      if (!resposta.ok) {
        resultado.className = 'erro';
        resultado.textContent = 'Erro ' + resposta.status + ': ' + dados.erro;
        return;
      }

      // Aqui vem UM objeto (e não um array)
      resultado.className = '';
      resultado.textContent = dados.nome + ' (' + dados.email + ') faz o curso ' + (dados.curso ?? 'não informado');
    }

    document.getElementById('btnListar').addEventListener('click', listarAlunos);
    document.getElementById('btnBuscar').addEventListener('click', buscarAluno);
  </script>
</body>
</html>
